<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bismarck-Mandan Location Scout</title>
<meta name="description" content="Find, filter, and plan portrait session locations around Bismarck and Mandan, North Dakota.">
<meta name="theme-color" content="#2b2118">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1>Bismarck-Mandan Location Scout</h1>
    <p class="tagline">Find your next shoot location. Filter, save, get directions.</p>
  </div>
  <div class="topbar-actions">
    <button id="btn-filters" class="btn btn-primary" type="button" aria-expanded="false" aria-controls="filter-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      Filters
      <span id="filter-badge" class="badge" hidden>0</span>
    </button>
  </div>
</header>

<nav class="view-tabs" role="tablist" aria-label="View">
  <button class="tab active" data-view="map" role="tab" aria-selected="true" type="button">Map</button>
  <button class="tab" data-view="list" role="tab" aria-selected="false" type="button">List</button>
</nav>

<main id="app">

  <section id="view-map" class="view active">
    <div id="map"></div>
    <div class="map-overlay-top">
      <span id="result-count" class="pill">Loading locations…</span>
    </div>
    <button id="btn-locate" class="fab" type="button" title="Sort by distance from me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </section>

  <section id="view-list" class="view">
    <div class="list-header">
      <span id="list-count" class="pill">0 locations</span>
      <select id="sort-select" aria-label="Sort locations">
        <option value="name">Sort: Name (A-Z)</option>
        <option value="distance">Sort: Nearest to me</option>
        <option value="confidence">Sort: Confidence</option>
      </select>
    </div>
    <div id="location-list" class="location-list"></div>
  </section>

</main>

<div id="filter-scrim" class="scrim" hidden></div>
<aside id="filter-panel" class="filter-panel" aria-hidden="true">
  <div class="filter-panel-header">
    <h2>Filters</h2>
    <button id="btn-close-filters" class="btn-icon" type="button" aria-label="Close filters">&times;</button>
  </div>

  <div class="filter-panel-body">
    <div class="filter-group">
      <label for="search-input">Search</label>
      <input id="search-input" type="search" placeholder="Name, city, or notes…" autocomplete="off">
    </div>

    <div class="filter-group">
      <span class="filter-group-title">Category</span>
      <div class="chip-row" id="chips-category"></div>
    </div>

    <div class="filter-group">
      <span class="filter-group-title">Session type</span>
      <div class="chip-row" id="chips-session"></div>
    </div>

    <div class="filter-group">
      <span class="filter-group-title">Confidence</span>
      <div class="chip-row" id="chips-confidence"></div>
    </div>

    <div class="filter-group">
      <label class="checkbox-row">
        <input type="checkbox" id="chk-favorites">
        Show only my shortlist (<span id="fav-count">0</span> saved)
      </label>
    </div>
  </div>

  <div class="filter-panel-footer">
    <button id="btn-reset" class="btn btn-ghost" type="button">Reset filters</button>
    <button id="btn-apply" class="btn btn-primary" type="button">Show results</button>
  </div>
</aside>

<div id="detail-scrim" class="scrim" hidden></div>
<section id="detail-sheet" class="detail-sheet" aria-hidden="true">
  <button id="btn-close-detail" class="btn-icon detail-close" type="button" aria-label="Close">&times;</button>
  <div id="detail-content"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="js/app.js"></script>
</body>
</html>
